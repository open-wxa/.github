name: 功能建议
description: 支持新的 API、组件或使用场景
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么困难？例如「项目使用了 canvas 2d，无法在浏览器中渲染图表」。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如果涉及微信 API 或组件，请附上官方文档链接。

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你考虑过的替代做法或临时绕过方式。

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与
      options:
        - label: 我愿意为这个功能提交 PR
